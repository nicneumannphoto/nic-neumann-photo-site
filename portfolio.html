<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio · Nic Neumann Photography</title>
<meta name="description" content="Weddings, couples, families and more — galleries by Denver photographer Nic Neumann.">
<link rel="icon" href="assets/mark-brown.png">
<script src="./support.js"></script>
<script src="./booking-notice.js" defer></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;1,300;1,400&amp;family=Figtree:wght@400;500;600&amp;display=swap" rel="stylesheet">
<script src="./gallery-data.js"></script>
<style>html{scroll-behavior:smooth}body{margin:0;background:#FAF2EB;color:#372017;font-family:Figtree,system-ui,sans-serif;-webkit-font-smoothing:antialiased}*{box-sizing:border-box}a{color:#372017;text-underline-offset:5px;text-decoration-thickness:1px}a:hover{color:#716A43}input,select,textarea,button{font-family:inherit;color:inherit}::selection{background:#C1AD8C;color:#372017}</style>
</helmet>

<div style="min-height:100vh;background:#FAF2EB">

  <div style="position:fixed;top:0;left:0;right:0;z-index:40;background:rgba(250,242,235,0.96);border-bottom:1px solid rgba(193,173,140,0.6);transform:translateY({{ barY }});transition:transform .45s cubic-bezier(.2,.7,.2,1);backdrop-filter:blur(6px)">
    <nav style="display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px 28px;padding:16px 20px;font:500 11px/1 Figtree,sans-serif;letter-spacing:.2em;text-transform:uppercase">
      <a href="portfolio.html" style="text-decoration:none" style-hover="text-decoration:underline">Portfolio</a>
      <a href="about.html" style="text-decoration:none" style-hover="text-decoration:underline">About</a>
      <a href="inquire.html" style="text-decoration:none" style-hover="text-decoration:underline">Inquire</a>
    </nav>
  </div>

  <header id="top" style="display:flex;flex-direction:column;align-items:center;gap:26px;padding:48px 24px 16px">
    <a href="index.html" style="display:block;line-height:0"><sc-if value="{{ logoMoss }}" hint-placeholder-val="{{ true }}"><img src="assets/primary-moss.png" alt="Nic Neumann Photography" style="width:min(420px,78vw);height:auto"></sc-if><sc-if value="{{ logoBrown }}" hint-placeholder-val="{{ false }}"><img src="assets/primary-brown.png" alt="Nic Neumann Photography" style="width:min(420px,78vw);height:auto"></sc-if></a>
    <nav style="display:flex;justify-content:center;flex-wrap:wrap;gap:10px 40px;font:500 12px/1 Figtree,sans-serif;letter-spacing:.2em;text-transform:uppercase">
      <a href="portfolio.html" style="text-decoration:none" style-hover="text-decoration:underline">Portfolio</a>
      <a href="about.html" style="text-decoration:none" style-hover="text-decoration:underline">About</a>
      <a href="inquire.html" style="text-decoration:none" style-hover="text-decoration:underline">Inquire</a>
    </nav>
  </header>

  <section id="portfolio" style="padding:0 24px 112px;scroll-margin-top:60px;padding-top:24px">
    <div style="max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:40px">
      <div style="display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center">
        <span style="font:500 12px/1 Figtree,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#716A43">Portfolio</span>
        <h2 style="margin:0;font:400 clamp(30px,4vw,44px)/1.1 'Crimson Pro',Georgia,serif;letter-spacing:.1em;text-transform:uppercase">The Galleries</h2>
      </div>
      <div style="display:flex;flex-direction:column;gap:clamp(28px,3vw,40px)">
        <sc-for list="{{ allCats }}" as="c" hint-placeholder-count="5">
          <div style="display:grid;grid-template-columns:repeat(24,minmax(0,1fr));align-items:center;row-gap:20px">
            <button onClick="{{ c.open }}" onMouseEnter="{{ c.enter }}" onMouseLeave="{{ c.leave }}" aria-label="Open {{ c.label }} gallery" style="grid-column:{{ c.imgCol }};grid-row:1;position:relative;display:block;width:100%;aspect-ratio:4/5;border:0;padding:0;margin:0;overflow:hidden;background:#F1E6DA;cursor:pointer">
              <div style="position:absolute;inset:0;transform:scale({{ c.scale }});transition:transform 1.4s cubic-bezier(.2,.7,.2,1)">
                <img src="{{ c.src }}" alt="{{ c.label }}" loading="lazy" decoding="async" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center {{ c.crop }};display:block">
              </div>
              <div style="position:absolute;inset:0;pointer-events:none;background:rgba(55,32,23,{{ c.dim }});transition:background .6s ease"></div>
            </button>
            <button onClick="{{ c.open }}" onMouseEnter="{{ c.enter }}" onMouseLeave="{{ c.leave }}" style="grid-column:{{ c.lblCol }};grid-row:{{ c.lblRow }};border:0;background:transparent;padding:0 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;color:#372017">
              <span style="font:400 clamp(26px,2.6vw,38px)/1 'Crimson Pro',Georgia,serif;letter-spacing:.14em;text-transform:uppercase">{{ c.label }}</span>
              <span style="display:block;height:1px;background:#C1AD8C;width:{{ c.line }};transition:width .9s cubic-bezier(.2,.7,.2,1)"></span>
              <span style="max-width:260px;font:italic 300 clamp(17px,1.5vw,20px)/1.35 'Crimson Pro',Georgia,serif;color:#716A43;text-wrap:balance">{{ c.sub }}</span>
            </button>
          </div>
        </sc-for>
      </div>
    </div>
  </section>

  <footer style="background:#372017;color:#FAF2EB;padding:72px 24px 40px;display:flex;flex-direction:column;align-items:center;gap:34px;text-align:center">
    <img src="assets/location-cream.png" alt="Nic Neumann Photography — Denver, Colorado" style="width:min(320px,72vw);height:auto">
    <nav style="display:flex;justify-content:center;flex-wrap:wrap;gap:10px 34px;font:500 11px/1 Figtree,sans-serif;letter-spacing:.2em;text-transform:uppercase">
      <a href="index.html" style="color:#FAF2EB;text-decoration:none" style-hover="text-decoration:underline">Home</a>
      <a href="portfolio.html" style="color:#FAF2EB;text-decoration:none" style-hover="text-decoration:underline">Portfolio</a>
      <a href="about.html" style="color:#FAF2EB;text-decoration:none" style-hover="text-decoration:underline">About</a>
      <a href="index.html#notes" style="color:#FAF2EB;text-decoration:none" style-hover="text-decoration:underline">{{ shoutNav }}</a>
      <a href="inquire.html" style="color:#FAF2EB;text-decoration:none" style-hover="text-decoration:underline">Inquire</a>
    </nav>
    <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:10px 30px;font:400 15px/1.4 Figtree,sans-serif">
      <a href="mailto:hello@nicneumannphoto.com" style="color:#FAF2EB;text-decoration:underline">hello@nicneumannphoto.com</a>
      <a href="https://www.instagram.com/nickneumannphoto/" style="color:#FAF2EB;text-decoration:underline">Instagram</a>
      <a href="https://www.facebook.com/nickneumannphoto" style="color:#FAF2EB;text-decoration:underline">Facebook</a>
    </div>
    <div style="width:100%;max-width:1200px;height:1px;background:rgba(193,173,140,0.4)"></div>
    <span style="font:400 12px/1 Figtree,sans-serif;letter-spacing:.08em;color:#E9DCCB">© 2026 Nic Neumann Photography · Denver, Colorado</span>
  </footer>

  <sc-if value="{{ portfolioOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;inset:0;z-index:90;background:#FAF2EB;overflow-y:auto">
      <div style="position:sticky;top:0;z-index:2;background:rgba(250,242,235,0.96);border-bottom:1px solid rgba(193,173,140,0.6);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 20px">
        <button onClick="{{ closePortfolio }}" style="justify-self:start;border:0;background:transparent;cursor:pointer;padding:10px 0;font:500 11px/1 Figtree,sans-serif;letter-spacing:.2em;text-transform:uppercase">← Home</button>
        <span style="font:400 24px/1 'Crimson Pro',Georgia,serif;letter-spacing:.12em;text-transform:uppercase">Portfolio</span>
        <button onClick="{{ closePortfolio }}" aria-label="Close" style="justify-self:end;border:1px solid #372017;background:transparent;width:44px;height:44px;border-radius:50%;cursor:pointer;font-size:18px">×</button>
      </div>
      <div style="max-width:1100px;margin:0 auto;padding:48px 24px 96px">
        <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:36px 20px">
        <sc-for list="{{ allCats }}" as="c" hint-placeholder-count="5">
          <div style="flex:0 1 calc(33.333% - 14px);min-width:min(280px,100%);display:flex;flex-direction:column;gap:16px;padding-top:{{ c.offset }}">
            <div onMouseEnter="{{ c.enter }}" onMouseLeave="{{ c.leave }}" style="position:relative;aspect-ratio:4/5;overflow:hidden;background:#F1E6DA">
              <div style="position:absolute;inset:0;transform:scale({{ c.scale }});transition:transform 1.4s cubic-bezier(.2,.7,.2,1)">
                <img src="{{ c.src }}" alt="{{ c.label }}" loading="lazy" decoding="async" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block">
              </div>
              <div style="position:absolute;inset:0;pointer-events:none;background:rgba(55,32,23,0.48);opacity:{{ c.scrim }};transition:opacity .6s ease"></div>
              <div style="position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 10px rgba(55,32,23,0.62)"></div>
              <button onClick="{{ c.open }}" style="position:absolute;inset:0;border:0;background:transparent;cursor:pointer;pointer-events:{{ c.pe }};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#FAF2EB;opacity:{{ c.scrim }};transition:opacity .6s ease">
                <span style="font:400 clamp(28px,3vw,38px)/1 'Crimson Pro',Georgia,serif;letter-spacing:.12em;text-transform:uppercase;transform:translateY({{ c.y }});transition:transform .8s cubic-bezier(.2,.7,.2,1)">{{ c.label }}</span>
                <span style="display:flex;align-items:center;gap:12px"><span style="height:1px;background:#FAF2EB;width:{{ c.line }};transition:width .9s cubic-bezier(.2,.7,.2,1) .1s"></span><img src="assets/mark-cream.png" alt="" style="height:26px;width:auto;display:block"><span style="height:1px;background:#FAF2EB;width:{{ c.line }};transition:width .9s cubic-bezier(.2,.7,.2,1) .1s"></span></span>
                <span style="max-width:80%;font:italic 300 19px/1.4 'Crimson Pro',Georgia,serif;text-wrap:balance;transform:translateY({{ c.y }});transition:transform .9s cubic-bezier(.2,.7,.2,1) .05s">{{ c.sub }}</span>
              </button>
            </div>
            <button onClick="{{ c.open }}" style="border:0;background:transparent;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center">
              <span style="font:500 13px/1 Figtree,sans-serif;letter-spacing:.2em;text-transform:uppercase">{{ c.label }}</span>
            </button>
          </div>
        </sc-for>
        </div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ galleryOpen }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;inset:0;z-index:100;background:#5E4A41;color:#FAF2EB;overflow-y:auto">
      <div style="position:sticky;top:0;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:14px clamp(16px,3vw,40px);background:rgba(94,74,65,0.94);backdrop-filter:blur(6px)">
        <button onClick="{{ closeGallery }}" style="border:0;background:transparent;color:#FAF2EB;cursor:pointer;padding:10px 0;font:500 11px/1 Figtree,sans-serif;letter-spacing:.2em;text-transform:uppercase">← Back</button>
        <button onClick="{{ closeGallery }}" aria-label="Close" style="border:1px solid #FAF2EB;background:transparent;color:#FAF2EB;width:44px;height:44px;border-radius:50%;cursor:pointer;font-size:18px">×</button>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px 24px 52px;text-align:center">
        <h2 style="margin:0;font:400 clamp(46px,6.5vw,88px)/1 'Crimson Pro',Georgia,serif;letter-spacing:.12em;text-transform:uppercase">{{ gallery.label }}</h2>
        <span style="font:italic 300 clamp(20px,2.2vw,26px)/1.4 'Crimson Pro',Georgia,serif;color:#E9DCCB;text-wrap:balance">{{ gallery.sub }}</span>
      </div>
      <div style="padding:0 clamp(24px,7vw,120px)">
        <sc-if value="{{ gallery.hasPhotos }}" hint-placeholder-val="{{ true }}">
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,calc(50% - 6px)),1fr));gap:12px">
            <sc-for list="{{ gallery.photos }}" as="p" hint-placeholder-count="12">
              <button onClick="{{ p.open }}" aria-label="{{ p.alt }}" style="display:block;border:0;padding:0;margin:0;background:#4A3930;aspect-ratio:4/5;overflow:hidden;cursor:zoom-in;opacity:0.7;transition:opacity .45s ease" style-hover="opacity:0.92">
                <img src="{{ p.src }}" alt="{{ p.alt }}" loading="lazy" decoding="async" style="width:100%;height:100%;object-fit:cover;display:block">
              </button>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{ gallery.noPhotos }}" hint-placeholder-val="{{ false }}">
          <div style="padding:80px 0;text-align:center;font:italic 300 24px/1.4 'Crimson Pro',Georgia,serif;color:#E9DCCB">Gallery coming soon</div>
        </sc-if>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:36px;padding:80px 24px 56px">
        <button onClick="{{ galleryInquire }}" style="border:1px solid #FAF2EB;background:transparent;color:#FAF2EB;padding:17px 32px;cursor:pointer;font:500 12px/1 Figtree,sans-serif;letter-spacing:.22em;text-transform:uppercase" style-hover="background:#FAF2EB;color:#372017">Let’s start planning</button>
        <img src="assets/mark-cream.png" alt="Nic Neumann Photography" style="height:48px;width:auto;display:block">
      </div>
    </div>
    <sc-if value="{{ lbOpen }}" hint-placeholder-val="{{ false }}">
      <div onClick="{{ closeLb }}" style="position:fixed;inset:0;z-index:110;display:flex;align-items:center;justify-content:center;padding:clamp(52px,8vh,90px) clamp(22px,7vw,120px);background:rgba(40,24,17,{{ lb.dim }});transition:background .4s ease;cursor:zoom-out">
        <div onClick="{{ stopClick }}" style="position:relative;line-height:0;cursor:default;opacity:{{ lb.op }};transform:translateY({{ lb.y }}) scale({{ lb.scale }});transition:transform .55s cubic-bezier(.2,.7,.2,1),opacity .35s ease;box-shadow:0 34px 80px rgba(20,10,6,0.55),0 10px 24px rgba(20,10,6,0.35)">
          <img src="{{ lb.src }}" alt="{{ lb.alt }}" decoding="async" style="display:block;max-width:min(86vw,1500px);max-height:82vh;width:auto;height:auto;border:8px solid #FAF2EB">
          <button onClick="{{ closeLb }}" aria-label="Close photo" style="position:absolute;top:-18px;right:-18px;width:40px;height:40px;border-radius:50%;border:0;background:#FAF2EB;color:#372017;cursor:pointer;font-size:20px;line-height:1;box-shadow:0 4px 14px rgba(20,10,6,0.35)">×</button>
          <button onClick="{{ lbPrev }}" aria-label="Previous photo" style="position:absolute;left:16px;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(250,242,235,0.85);color:#372017;cursor:pointer;font-size:16px" style-hover="background:#FAF2EB">←</button>
          <button onClick="{{ lbNext }}" aria-label="Next photo" style="position:absolute;right:16px;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(250,242,235,0.85);color:#372017;cursor:pointer;font-size:16px" style-hover="background:#FAF2EB">→</button>
        </div>
      </div>
    </sc-if>
  </sc-if>


</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;logoColor&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Moss Green&quot;,&quot;Dark Brown&quot;],&quot;default&quot;:&quot;Moss Green&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Brand&quot;},&quot;shoutTitle&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Notes From Friends&quot;,&quot;Client Love Notes&quot;,&quot;Shout-Outs&quot;,&quot;Client Raves&quot;],&quot;default&quot;:&quot;Notes From Friends&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Copy&quot;},&quot;heroTiles&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;3&quot;,&quot;4&quot;],&quot;default&quot;:&quot;3&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Hero&quot;},&quot;heroSpeed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:5,&quot;max&quot;:20,&quot;step&quot;:1,&quot;unit&quot;:&quot;s&quot;,&quot;default&quot;:9,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Hero&quot;},&quot;crop_weddings&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:100,&quot;step&quot;:1,&quot;unit&quot;:&quot;%&quot;,&quot;default&quot;:50,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Cover crop (0 = top, 100 = bottom)&quot;},&quot;crop_couples&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:100,&quot;step&quot;:1,&quot;unit&quot;:&quot;%&quot;,&quot;default&quot;:50,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Cover crop (0 = top, 100 = bottom)&quot;},&quot;crop_families&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:100,&quot;step&quot;:1,&quot;unit&quot;:&quot;%&quot;,&quot;default&quot;:50,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Cover crop (0 = top, 100 = bottom)&quot;},&quot;crop_headshots&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:100,&quot;step&quot;:1,&quot;unit&quot;:&quot;%&quot;,&quot;default&quot;:50,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Cover crop (0 = top, 100 = bottom)&quot;},&quot;crop_seniors&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:100,&quot;step&quot;:1,&quot;unit&quot;:&quot;%&quot;,&quot;default&quot;:50,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Cover crop (0 = top, 100 = bottom)&quot;}}">
class Component extends DCLogic {
  state = { mob: 0, frames: [0, 0, 0, 0], hover: null, gallery: null, quote: 0, sent: false, scrolled: false, hash: (typeof location !== 'undefined' ? location.hash : '') };
  reelRef = React.createRef();
  cats = [
    { key: 'weddings', label: 'Weddings', sub: 'Big celebrations & mountaintop elopements' },
    { key: 'couples', label: 'Couples', sub: 'Engagements, anniversaries, just because' },
    { key: 'families', label: 'Families', sub: 'Little ones, big ones, the whole crew' },
  ];
  moreCats = [
    { key: 'headshots', label: 'Headshots', sub: 'Approachable, professional, you' },
    { key: 'seniors', label: 'Seniors', sub: 'Celebrating the class of right now' },
  ];
  quotes = [
    { text: 'Nic made us feel like we were hanging out with an old friend. We forgot there was a camera — and somehow every single photo looks exactly like us.', who: 'Emma & Jake', what: 'Wedding' },
    { text: 'Wrangling three kids and a dog is no small feat. Nic kept everyone laughing, and we finally have family photos we actually want on our walls.', who: 'The Martinez Family', what: 'Family session' },
    { text: 'From our first email to the gallery reveal, everything felt easy and intentional. We cried looking through them. Twice.', who: 'Priya & Sam', what: 'Elopement' },
  ];
  initInquiry() {
    const el = document.getElementById('inquiry-form');
    if (el && el !== this.fsForm) { this.fsForm = el; window.formspree('initForm', { formElement: '#inquiry-form', formId: 'mppqppqv' }); }
  }
  componentDidUpdate() { this.initInquiry(); }
  componentDidMount() {
    this.initInquiry();
    this.onScroll = () => { const s = window.scrollY > 280; if (s !== this.state.scrolled) this.setState({ scrolled: s }); };
    this.onHash = () => this.setState({ hash: location.hash }, () => {
      const id = location.hash.slice(1);
      if (id && id !== 'availability') { const el = document.getElementById(id); if (el) window.scrollTo(0, el.getBoundingClientRect().top + window.scrollY - 40); }
      else if (id === 'availability') window.scrollTo(0, 0);
    });
    this.onKey = (e) => { if (this.state.gallery && this.state.lb != null) { if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { this.lbStep(e.key === 'ArrowRight' ? 1 : -1); return; } if (e.key === 'Escape') { this.closeLb(); return; } } if (e.key !== 'Escape') return; if (this.state.gallery) this.closeGallery(); else if (this.state.portfolio) { document.body.style.overflow = ''; this.setState({ portfolio: false }); } };
    this.onResize = () => { const w = window.innerWidth >= 640; if (w !== this.state.wide) this.setState({ wide: w }); };
    this.onResize(); window.addEventListener('resize', this.onResize);
    window.addEventListener('scroll', this.onScroll, { passive: true });
    window.addEventListener('hashchange', this.onHash);
    window.addEventListener('keydown', this.onKey);
    if (location.hash.length > 1) setTimeout(this.onHash, 400);
    if (!window.NNP_GALLERIES) this.dataTimer = setInterval(() => { if (window.NNP_GALLERIES) { clearInterval(this.dataTimer); this.forceUpdate(); } }, 100);
  }
  componentDidUpdate(prev) {
    
  }
  componentWillUnmount() {
    clearInterval(this.timer); clearInterval(this.dataTimer);
    window.removeEventListener('scroll', this.onScroll); window.removeEventListener('resize', this.onResize);
    window.removeEventListener('hashchange', this.onHash);
    window.removeEventListener('keydown', this.onKey); clearInterval(this.galTimer);
  }
  tileCount() { return parseInt(this.props.heroTiles ?? '3', 10); }
  startTimer() {
    clearInterval(this.timer);
    const n = this.tileCount();
    const per = (this.props.heroSpeed ?? 9) * 1000;
    let col = 0;
    this.timer = setInterval(() => {
      this.setState(s => { const f = s.frames.slice(); f[col] = (f[col] + 1) % 4; return { frames: f, mob: ((s.mob || 0) + 1) % (n * 4) }; });
      col = (col + 1) % n;
    }, per / n);
  }
  galKeys() { const G = window.NNP_GALLERIES || {}; return [...this.cats, ...this.moreCats].filter(c => (G[c.key] || []).length).map(c => c.key); }
  galStep(d) {
    const G = window.NNP_GALLERIES || {}; const keys = this.galKeys();
    this.setState(s => {
      if (!s.gallery) return null;
      let k = s.gallery, i = (s.gIdx || 0) + d; const len = (G[k] || []).length;
      if (i >= len) { k = keys[(keys.indexOf(k) + 1) % keys.length]; i = 0; }
